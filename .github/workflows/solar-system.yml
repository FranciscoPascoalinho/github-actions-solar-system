name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*' 
env:
  MONGO_URI : ‘mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD : ${{ secrets.MONGO_PASSWORD }}
jobs:
    docker:
      permissions:
        packages: write 
      name: docker job
      runs-on: ubuntu-latest
      needs: [unit-testing,code-coverage]
      steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - name:  login into Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ' ${{ github.repository_owner }} ' 
          Password: ' ${{ secrets.GITHUB_TOKEN }} ' 
      - name: push docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: 'ghcr.io/${{ env.REPO_OWNER_LC }}/solar-system:${{ github.sha }}'
    unit-testing:
        name: Unit Testing
        continue-on-error: true
        runs-on: ubuntu-latest
        container:
          image: 'node:20'
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
          
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
            path: ~/.npm
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if : always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml      
    code-coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4         
        - name: setup NodeJS of version 18
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: install nodejs dependencies
          run: npm install
        - name:  execute code coverage code
          continue-on-error: true
          run: npm run code-coverage
        - name: upload code-coverage reports
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5
    dev-deploy:
      runs-on: ubuntu-latest
      needs: docker
      environment: development
      steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Install Kubectl - version 1.26.0
        uses: Azure/setup-kubectl@v4.0.0
        with:
          version: v1.26
      - name: k8s set context
        uses: Azure/k8s-set-context@v3.0
        with:
          method: kubeconfig
          kubeconfig: '${{ secrets.KUBECONFIG }}'
      - name: to verify Step 2 and 3
        run: kubectl version --short -o yaml
        
      
      
          
          
